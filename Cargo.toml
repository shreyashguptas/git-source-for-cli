[package]
name = "gsc"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Git source control TUI — VS Code's source control panel + git graph in your terminal"
repository = "https://github.com/shreyashguptas/gsc"
readme = "README.md"
keywords = ["git", "tui", "graph", "cli", "source-control"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "gsc"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "sync", "time", "signal", "fs", "net", "io-util"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
notify = "8"
notify-debouncer-mini = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
opt-level = 0
debug = 1
